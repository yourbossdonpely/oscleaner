name: Build app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release at a time, and never cancel a run halfway through uploading assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # One universal binary for Apple Silicon and Intel.
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        # squashfs-tools packs the AppImage; the rest is the documented
        # Debian list for WebKitGTK 4.1 plus standard build tools.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file zip xvfb dbus-x11 libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both halves; aarch64 is the runner default.
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'OS Cleaner ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          retryAttempts: 3
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
